# =============================================================================
# workflow/slurm_profile/config.yaml
# Snakemake 7.x SLURM cluster profile for maurano_dhs_validation
# =============================================================================
#
# Usage (from experiments/maurano_dhs_validation):
#   snakemake --profile workflow/slurm_profile/
#
# Each rule's resources: block in the Snakefile is templated into the sbatch
# command below. Logs land in logs/slurm/.

cluster: >-
  sbatch
  --partition=shared
  --account=blangme2
  --mem={resources.mem_mb}M
  --time={resources.runtime}
  --cpus-per-task={resources.cpus_per_task}
  --job-name=mdv_{rule}
  --output=logs/slurm/%x_%j.out
  --error=logs/slurm/%x_%j.err

default-resources:
  mem_mb:          8000
  runtime:         120          # minutes
  cpus_per_task:   1

# Snakemake-side knobs.
jobs:             80      # concurrent SLURM jobs
latency-wait:     60
rerun-incomplete: true
keep-going:       true
printshellcmds:   true
use-envmodules:   true    # honor envmodules: r/4.3.0 in rule analyze
